name: Build and Push

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".env.example"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Build Next.js once (architecture-independent output).
  # Skipped entirely on cache hit so server.js/Dockerfile-only pushes pay ~0s here.
  build-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Next.js output
        id: nextjs-cache
        uses: actions/cache@v4
        with:
          path: |
            .next/standalone
            .next/static
          key: nextjs-${{ hashFiles('src/**', 'public/**', 'package.json', 'package-lock.json', 'version.json') }}

      - name: Cache npm
        if: steps.nextjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Cache Next.js incremental
        if: steps.nextjs-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-inc-${{ hashFiles('src/**', 'public/**', 'package.json') }}
          restore-keys: nextjs-inc-

      - name: Install dependencies
        if: steps.nextjs-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit --no-fund

      - name: Build
        if: steps.nextjs-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Pack build output
        run: tar -cf /tmp/nextjs-build.tar .next/standalone .next/static

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: /tmp/nextjs-build.tar
          retention-days: 3

  docker:
    needs: build-app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Download Next.js build
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: /tmp

      - name: Extract build
        run: tar -xf /tmp/nextjs-build.tar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/claudeailab/remacc,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: version.json
          sparse-checkout-cone-mode: false

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version version.json)" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ghcr.io/claudeailab/remacc:latest \
            -t "ghcr.io/claudeailab/remacc:v${{ steps.version.outputs.version }}" \
            $(printf 'ghcr.io/claudeailab/remacc@sha256:%s ' *)
